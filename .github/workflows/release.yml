name: Release

on:
  push:
    tags: [ "v*" ]

env:
  DOTNET_VERSION: "10.0.x"
  CONFIGURATION: Release
  PLATFORM: x64

jobs:
  release:
    name: Build release artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore conNCW-NG.sln

      - name: Publish self-contained single-file (win-x64)
        run: >
          dotnet publish src/ConNCW.Cli/conNCW-NG.Cli.csproj
          -c ${{ env.CONFIGURATION }}
          -r win-x64
          -p:Platform=${{ env.PLATFORM }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/release

      - name: Zip artifact
        run: Compress-Archive -Path publish/release/* -DestinationPath conncw-${{ github.ref_name }}-win-x64.zip
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: conncw-${{ github.ref_name }}-win-x64
          path: conncw-${{ github.ref_name }}-win-x64.zip
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: conNCW-NG-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
